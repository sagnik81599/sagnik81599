<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 360" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceBg" cx="70%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="torusGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#091e4a" />
    </linearGradient>
    <linearGradient id="torusGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="80%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="torusGradHighlight" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="cyberGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.45" />
      <circle cx="36" cy="36" r="1" fill="#38bdf8" opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.03); }
    }
    @keyframes float3D {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(2deg); }
    }
    .floating-knot {
      animation: float3D 6s ease-in-out infinite;
      transform-origin: 730px 180px;
    }
    .pulsing-portal {
      animation: pulseGlow 4s ease-in-out infinite;
      transform-origin: 740px 180px;
    }
  </style>

  <rect width="950" height="360" rx="16" fill="url(#spaceBg)" />
  <rect width="950" height="360" rx="16" fill="url(#cyberGrid)" />

  <g opacity="0.7">
    <circle cx="85" cy="50" r="1.5" fill="#ffffff" opacity="0.8" />
    <circle cx="210" cy="85" r="1.2" fill="#38bdf8" opacity="0.6" />
    <circle cx="340" cy="40" r="1.8" fill="#ffffff" opacity="0.7" />
    <circle cx="480" cy="95" r="1.2" fill="#818cf8" opacity="0.6" />
    <circle cx="120" cy="290" r="1.4" fill="#ffffff" opacity="0.5" />
    <circle cx="420" cy="310" r="1.6" fill="#38bdf8" opacity="0.7" />
    <circle cx="890" cy="70" r="1.8" fill="#ffffff" opacity="0.8" />
    <circle cx="910" cy="280" r="1.2" fill="#818cf8" opacity="0.6" />
    <circle cx="610" cy="45" r="1.5" fill="#38bdf8" opacity="0.5" />
  </g>

  <circle cx="730" cy="180" r="150" fill="#1e40af" opacity="0.25" filter="url(#neonGlow)" class="pulsing-portal" />
  <circle cx="730" cy="180" r="95" fill="#0284c7" opacity="0.3" filter="url(#softGlow)" />

  <g class="floating-knot">
    <path d="M 640 180 C 640 100, 720 70, 780 110 C 830 145, 840 230, 780 260 C 730 285, 660 250, 680 190"
          fill="none" stroke="url(#torusGrad2)" stroke-width="36" stroke-linecap="round" opacity="0.9" />
    <path d="M 670 140 C 720 90, 810 110, 830 170 C 850 230, 780 280, 710 260 C 640 240, 630 150, 700 130 C 760 110, 820 180, 770 230"
          fill="none" stroke="url(#torusGrad1)" stroke-width="42" stroke-linecap="round" />
    <path d="M 685 135 C 730 95, 805 115, 822 165 C 835 205, 800 245, 755 240"
          fill="none" stroke="url(#torusGradHighlight)" stroke-width="10" stroke-linecap="round" />
    <ellipse cx="630" cy="120" rx="28" ry="12" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.75" transform="rotate(-25 630 120)" />
    <ellipse cx="830" cy="240" rx="36" ry="14" fill="none" stroke="#818cf8" stroke-width="2.5" opacity="0.6" transform="rotate(35 830 240)" />
    <circle cx="740" cy="180" r="74" fill="#090d16" stroke="#38bdf8" stroke-width="4" filter="url(#softGlow)" />
    <circle cx="740" cy="180" r="68" fill="#0f172a" />
    <text x="740" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#38bdf8" text-anchor="middle">SS</text>
    <circle cx="740" cy="180" r="74" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="12 8" opacity="0.8" />
  </g>

  <g transform="translate(60, 48)">
    <rect width="210" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#38bdf8" filter="url(#softGlow)" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">
      Hello, I'm Sagnik Saha
    </text>
  </g>

  <g transform="translate(60, 140)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="44" fill="#ffffff">
      I'm <tspan fill="#38bdf8">Developer</tspan><tspan fill="#38bdf8" class="pulsing-portal">|</tspan>
    </text>
  </g>

  <g transform="translate(60, 185)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#94a3b8" y="0">
      Full Stack Web Developer crafting modern, high-performance web applications.
    </text>
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#94a3b8" y="24">
      MCA Student @ Lovely Professional University · Problem Solver on LeetCode.
    </text>
  </g>

  <g transform="translate(60, 255)">
    <g transform="translate(0, 0)">
      <rect width="78" height="28" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="39" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">⚛️ React</text>
    </g>
    <g transform="translate(86, 0)">
      <rect width="112" height="28" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
      <text x="56" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#a5b4fc" text-anchor="middle">🐘 PHP / Laravel</text>
    </g>
    <g transform="translate(206, 0)">
      <rect width="84" height="28" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="42" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#7dd3fc" text-anchor="middle">🐬 MySQL</text>
    </g>
    <g transform="translate(298, 0)">
      <rect width="98" height="28" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
      <text x="49" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#fcd34d" text-anchor="middle">⚡ LeetCode</text>
    </g>
  </g>
  <rect x="0" y="356" width="950" height="4" fill="url(#torusGrad1)" rx="2" />
</svg>
