name: Update LeetCode card

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate LeetCode card
        env:
          LEETCODE_USERNAME: YOUR-LEETCODE-USERNAME
        run: python3 scripts/leetcode_card.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leetcode.svg
          git diff --staged --quiet || (git commit -m "chore: update LeetCode card" && git push)
